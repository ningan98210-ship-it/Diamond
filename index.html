<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>璨 · 鑽石行星</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Noto+Serif+TC:wght@300;500;700&family=Noto+Serif+JP:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef3ff; --dim:rgba(220,230,255,.55); --faint:rgba(220,230,255,.28);
    --pink:#ffc6e0; --ice:#bfe3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04050b;overflow:hidden;color:var(--ink);
    font-family:"Noto Serif TC","Cormorant Garamond",serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}

  .ui{position:fixed;inset:0;pointer-events:none;transition:opacity .8s ease}
  .ui.hidden{opacity:0}
  .ui > *{pointer-events:auto}

  .brand{position:absolute;top:28px;left:32px;display:flex;align-items:center;gap:14px;
    font-family:"Cormorant Garamond",serif;letter-spacing:.32em;font-size:13px;color:var(--dim)}
  .brand svg{width:26px;height:26px}
  .brand b{color:var(--ink);font-weight:500}

  html[lang="ja"] body{font-family:"Noto Serif JP","Cormorant Garamond",serif}
  .lang{position:absolute;top:24px;right:32px;font:inherit;font-size:12px;letter-spacing:.16em;color:var(--ink);
    background:rgba(255,255,255,.04);border:1px solid rgba(220,235,255,.28);border-radius:999px;padding:7px 14px;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .3s ease}
  .lang:hover{border-color:var(--ice)}
  .tag{position:absolute;top:70px;right:32px;font-size:12px;letter-spacing:.2em;color:var(--faint);text-align:right;line-height:1.9}

  .hero{position:absolute;left:clamp(24px,6vw,96px);top:50%;transform:translateY(-50%);max-width:360px;pointer-events:none}
  .hero .kicker{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.42em;color:var(--dim);margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .hero .kicker::before{content:"";width:34px;height:1px;background:var(--faint)}
  .hero h1{font-weight:300;font-size:clamp(64px,10vw,124px);line-height:1;letter-spacing:.06em;
    background:linear-gradient(120deg,#ffffff 10%,#cfe8ff 38%,#ffd9ec 62%,#ffffff 90%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite;
    text-shadow:0 0 40px rgba(190,220,255,.15)}
  @keyframes sheen{to{background-position:-220% 0}}
  .hero .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:22px;color:var(--ink);margin:14px 0 26px;opacity:.85}
  .quote{font-size:15px;line-height:2;color:var(--ink);min-height:3.6em;transition:opacity .45s ease, transform .45s ease}
  .quote.swap{opacity:0;transform:translateY(6px)}
  .quote small{display:block;color:var(--faint);font-size:12px;letter-spacing:.2em;margin-top:6px}

  .readout{position:absolute;right:32px;bottom:34px;font-size:12px;line-height:2.1;color:var(--dim);text-align:right;letter-spacing:.08em}
  .readout span{color:var(--ink)}
  .readout .mood{color:var(--ice);transition:color .6s}
  .readout .mood.hot{color:var(--pink)}

  .controls{position:absolute;left:clamp(24px,6vw,96px);bottom:34px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .poke{font:inherit;font-size:14px;letter-spacing:.18em;color:var(--ink);background:rgba(255,255,255,.04);
    border:1px solid rgba(220,235,255,.28);padding:12px 22px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .3s ease}
  .poke:hover{border-color:var(--pink);box-shadow:0 0 24px rgba(255,190,225,.25)}
  .hint{font-size:12px;color:var(--faint);letter-spacing:.12em;line-height:1.8}
  .poke.moon{padding:12px 15px}
  .poke.moon.on{border-color:#b8b0ff;box-shadow:0 0 22px rgba(184,176,255,.35);color:#e6e1ff}
  .mhint{display:none;font-size:11px;color:var(--faint);letter-spacing:.1em;margin-top:10px;line-height:1.7}
  .hint kbd{font-family:inherit;border:1px solid var(--faint);border-radius:4px;padding:0 5px;margin:0 2px}

  #loader{position:fixed;inset:0;display:grid;place-items:center;background:#04050b;z-index:10;transition:opacity 1.2s ease;
    font-size:13px;letter-spacing:.4em;color:var(--dim)}
  #loader.done{opacity:0;pointer-events:none}

  @media (max-width:760px){
    .brand{top:20px;left:20px}
    .tag{display:none}
    .lang{top:16px;right:18px}
    .hero{top:15%;transform:none;left:22px;right:22px}
    .hero h1{font-size:72px}
    .hero .en{font-size:18px;margin:8px 0 14px}
    .quote{font-size:14px}
    .readout{right:20px;bottom:88px;font-size:12px}
    .controls{gap:10px;justify-content:flex-start}
    .poke{padding:11px 16px;font-size:13px;letter-spacing:.12em}
    .mhint{display:block}
    .readout .extra{display:none}
    .hint{display:none}
    .controls{left:20px;right:20px;bottom:24px}
    .hint .desk{display:none}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="stage"></div>
<div id="loader" data-i18n="loader">正在對焦</div>

<div class="ui" id="ui">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="#dfeaff" stroke-width="1">
      <path d="M16 3 L27 13 L16 29 L5 13 Z"/><path d="M5 13 H27 M11 13 L16 3 L21 13 L16 29 L11 13"/>
      <ellipse cx="16" cy="16" rx="15" ry="4.5" transform="rotate(-18 16 16)" stroke-opacity=".5"/>
    </svg>
    <div><b>CHAN</b> · 璨</div>
  </div>
  <button class="lang" id="lang">日本語</button>
  <div class="tag" data-i18n="tag">星球聯動<br>KIRAKIRA CLASS · 鑽石行星</div>

  <div class="hero">
    <div class="kicker">A DIAMOND WORLD</div>
    <h1>璨</h1>
    <div class="en">He knows he is beautiful.</div>
    <p class="quote" id="quote">「別一直盯著瞧呀，知道我長得好看，但眼睛要看花了！」<small>璨，對第一次靠近的探索船</small></p>
    <p class="mhint" data-i18n="mhint">點星球、點冰晶環、連戳很多下、放著不管，他都會有反應</p>
  </div>

  <div class="readout">
    <div class="extra"><span data-i18n="r1" style="color:inherit">折射率</span> <span>2.42</span><br>
    <span data-i18n="r2" style="color:inherit">自轉週期</span> <span id="spin">— —</span><br>
    <span data-i18n="r3" style="color:inherit">可居住指數</span> <span data-i18n="r3v">他說了算</span></div>
    <span data-i18n="r4" style="color:inherit">目前心情</span> <span class="mood" id="mood">自我欣賞中</span>
  </div>

  <div class="controls">
    <button class="poke" id="poke" data-i18n="poke">戳他一下</button>
    <button class="poke" id="compare" data-i18n="compare">找別顆比較</button>
    <button class="poke moon" id="night" title="深夜模式" data-i18n="night">夜</button>
    <div class="hint"><span class="desk" data-i18n="desk">點星球、點冰晶環、雙擊戳他、放著不管也有反應<br>拖曳旋轉　滾輪靠近　<kbd>H</kbd> 隱藏介面　<kbd>F</kbd> 全螢幕</span></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth < 760;
const Q = isMobile
  ? { crystals: 420, stars: 1600, dust: 900, dpr: Math.min(devicePixelRatio, 1.5), bloomScale: 0.5 }
  : { crystals: 1100, stars: 3800, dust: 2400, dpr: Math.min(devicePixelRatio, 2), bloomScale: 1 };

// seeded random so he always looks the same
let seed = 20261110;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const gauss = () => (rand() + rand() + rand() - 1.5) / 1.5;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050b);
const camera = new THREE.PerspectiveCamera(isMobile ? 50 : 38, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3, 18);

const pmrem = new THREE.PMREMGenerator(renderer);
// dark studio with a few hard light panels: diamonds read as black facets plus sharp flashes
function studioEnv() {
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x020308);
  const panel = (w, h, col, k, pos) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(4, 1.2, 0xffffff, 6, [0, 6, 3]);
  panel(1.2, 5, 0xcfe4ff, 4, [-7, 1, 2]);
  panel(1, 4, 0xffd9ec, 3.5, [7, -1, 1]);
  panel(3, 0.6, 0xffffff, 5, [2, -5, 5]);
  panel(0.8, 0.8, 0xffffff, 8, [-3, 3, 7]);
  panel(2, 2, 0x9fc0ff, 1.5, [0, 0, -8]);
  return env;
}
scene.environment = pmrem.fromScene(studioEnv(), 0.02).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 3.4;
controls.maxDistance = 18;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.enabled = false;
const restPos = isMobile ? new THREE.Vector3(0, 2.2, 15) : new THREE.Vector3(1.5, 1.9, 11.2);
// push the planet off-centre so it sits beside the text, while orbiting still pivots on him
function frame() {
  const w = innerWidth, h = innerHeight;
  if (w >= 760) camera.setViewOffset(w, h, -w * 0.13, 0, w, h);
  else camera.setViewOffset(w, h, 0, -h * 0.12, w, h);
}
frame();

/* ---------- textures ---------- */
function starTexture() {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), h = s / 2;
  const r = g.createRadialGradient(h, h, 0, h, h, h);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.12, 'rgba(255,255,255,.85)');
  r.addColorStop(0.3, 'rgba(200,225,255,.18)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
  g.globalCompositeOperation = 'lighter';
  const ray = (w, len, rot) => {
    g.save(); g.translate(h, h); g.rotate(rot);
    const lg = g.createLinearGradient(-len, 0, len, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,.95)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg; g.beginPath(); g.moveTo(-len, 0); g.lineTo(0, -w); g.lineTo(len, 0); g.lineTo(0, w); g.closePath(); g.fill();
    g.restore();
  };
  ray(3, h, 0); ray(3, h, Math.PI / 2); ray(1.4, h * 0.55, Math.PI / 4); ray(1.4, h * 0.55, -Math.PI / 4);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function glowTexture() {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), h = s / 2;
  const r = g.createRadialGradient(h, h, 0, h, h, h);
  r.addColorStop(0, 'rgba(255,255,255,.9)'); r.addColorStop(0.25, 'rgba(255,255,255,.35)');
  r.addColorStop(0.55, 'rgba(255,255,255,.08)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(c);
}
const STAR = starTexture(), GLOW = glowTexture();

/* ---------- the diamond ---------- */
const world = new THREE.Group();
scene.add(world);
const planet = new THREE.Group();
planet.rotation.z = 0.22;
world.add(planet);

let geo = new THREE.IcosahedronGeometry(1.5, 1);
geo.deleteAttribute('normal'); geo.deleteAttribute('uv');
geo = mergeVertices(geo);
{
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).multiplyScalar(1 + (rand() - 0.5) * 0.09);
    p.setXYZ(i, v.x, v.y, v.z);
  }
}
geo = geo.toNonIndexed();
geo.computeVertexNormals();

const gemMat = new THREE.MeshPhysicalMaterial({
  color: 0xf6f9ff, metalness: 0, roughness: 0.02,
  transmission: 1, thickness: 2.4, ior: 2.42, dispersion: 5,
  attenuationColor: new THREE.Color(0xd6ecff), attenuationDistance: 5,
  iridescence: 0.6, iridescenceIOR: 1.55, iridescenceThicknessRange: [180, 820],
  clearcoat: 1, clearcoatRoughness: 0.01, specularIntensity: 1,
  envMapIntensity: 1.6, flatShading: true
});
const gem = new THREE.Mesh(geo, gemMat);
planet.add(gem);

// a glowing heart inside, seen through the refraction
const coreMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x2a3c5e) });
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.34, 0), coreMat);
planet.add(core);
const innerFacets = new THREE.Mesh(new THREE.OctahedronGeometry(1.05, 0),
  new THREE.MeshBasicMaterial({ color: 0x9fc8ff, wireframe: true, transparent: true, opacity: 0.22 }));
planet.add(innerFacets);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0x9cc4ff, transparent: true,
  opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
halo.scale.setScalar(7.5);
world.add(halo);

/* ---------- facet glints (kirakira) ---------- */
const glintVS = `
  attribute vec3 aNormal; attribute float aRnd;
  uniform float uTime, uSize, uBoost, uSpec; uniform vec3 uLight;
  varying float vA; varying float vR;
  void main(){
    vec4 mv = modelViewMatrix * vec4(position,1.0);
    vec3 n = normalize(normalMatrix * aNormal);
    vec3 v = normalize(-mv.xyz);
    vec3 h = normalize(v + normalize(uLight));
    float spec = pow(max(dot(n,h),0.0), 70.0);
    float tw = pow(0.5 + 0.5*sin(uTime*(1.2+aRnd*3.4) + aRnd*61.0), 14.0);
    float facing = smoothstep(0.0, 0.25, dot(n,v));
    vA = facing * min(spec*1.6*uSpec + tw*(0.22 + 0.3*uBoost), 1.1);
    vR = aRnd;
    gl_PointSize = uSize * (0.35 + vA) * (300.0 / -mv.z);
    gl_Position = projectionMatrix * mv;
  }`;
const glintFS = `
  uniform sampler2D uTex; uniform float uMood; uniform vec3 uTint;
  varying float vA; varying float vR;
  void main(){
    vec4 t = texture2D(uTex, gl_PointCoord);
    vec3 cool = mix(vec3(0.82,0.92,1.0), vec3(0.95,0.85,1.0), vR);
    vec3 col = mix(cool, uTint, uMood);
    gl_FragColor = vec4(col * t.rgb * vA, t.a * vA);
  }`;
{
  const p = geo.attributes.position, nrm = geo.attributes.normal;
  const n = p.count / 3, pos = [], nor = [], rnd = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let f = 0; f < n; f++) {
    a.fromBufferAttribute(p, f * 3); b.fromBufferAttribute(p, f * 3 + 1); c.fromBufferAttribute(p, f * 3 + 2);
    // two glints per facet: centre, plus one near a corner
    const ctr = a.clone().add(b).add(c).multiplyScalar(1 / 3);
    const nn = new THREE.Vector3().fromBufferAttribute(nrm, f * 3);
    for (const pt of [ctr, ctr.clone().lerp(a, 0.55)]) {
      pt.addScaledVector(nn, 0.02);
      pos.push(pt.x, pt.y, pt.z); nor.push(nn.x, nn.y, nn.z); rnd.push(rand());
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aNormal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('aRnd', new THREE.Float32BufferAttribute(rnd, 1));
  var glintMat = new THREE.ShaderMaterial({
    vertexShader: glintVS, fragmentShader: glintFS, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uSize: { value: isMobile ? 0.55 : 0.42 }, uBoost: { value: 0 },
      uLight: { value: new THREE.Vector3(0.4, 0.6, 1) }, uTex: { value: STAR }, uMood: { value: 0 },
      uSpec: { value: 1 }, uTint: { value: new THREE.Color(1, 1, 1) } }
  });
  gem.add(new THREE.Points(g, glintMat));
}

/* ---------- emotion cloud bands (hidden until he gets flustered) ---------- */
const bands = [];
for (const [y, w, spd] of [[-0.62, 0.05, 0.6], [-0.05, 0.035, -0.9], [0.5, 0.06, 0.75], [0.9, 0.03, -0.5]]) {
  const r = Math.sqrt(Math.max(1.6 * 1.6 - y * y, 0.2)) * 1.12;
  for (const k of [1, 2.6]) {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, w * k, 8, 128),
      new THREE.MeshBasicMaterial({ color: 0xffd3ea, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.rotation.x = Math.PI / 2; m.position.y = y;
    m.userData = { spd, base: k === 1 ? 0.32 : 0.07 };
    planet.add(m); bands.push(m);
  }
}

/* ---------- tilted ice-crystal ring ---------- */
const ring = new THREE.Group();
ring.rotation.set(0.46, 0, -0.32);
world.add(ring);

const crystalMat = new THREE.MeshPhysicalMaterial({
  color: 0xb9c6dc, roughness: 0.04, metalness: 0.05, iridescence: 1, iridescenceIOR: 1.8,
  clearcoat: 1, envMapIntensity: 1.3, flatShading: true
});
const crystals = new THREE.InstancedMesh(new THREE.OctahedronGeometry(1, 0), crystalMat, Q.crystals);
crystals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const C = [];
const tints = [0xffffff, 0xd9eeff, 0xe8ddff, 0xffe6f3, 0xcfe7ff];
for (let i = 0; i < Q.crystals; i++) {
  let r;
  do { r = 2.3 + Math.pow(rand(), 1.4) * 1.35; } while (r > 2.86 && r < 2.98); // a small gap in the ring
  C.push({
    r, th: rand() * Math.PI * 2, y: gauss() * 0.035, spd: 0.32 / Math.pow(r, 1.5),
    s: 0.022 + Math.pow(rand(), 3) * 0.085, stretch: 1 + rand() * 1.4,
    axis: new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(), spin: 0.3 + rand() * 1.6,
    fy: (rand() - 0.5) * 2.6, fr: rand() * 0.9, ph: rand() * Math.PI * 2
  });
  crystals.setColorAt(i, new THREE.Color(tints[i % tints.length]));
  C[i].col = new THREE.Color(tints[i % tints.length]);
}
ring.add(crystals);

// fine shimmering dust inside the ring plane
{
  const pos = [], rnd = [];
  for (let i = 0; i < Q.dust; i++) {
    const r = 2.15 + rand() * 1.6, th = rand() * Math.PI * 2;
    pos.push(Math.cos(th) * r, gauss() * 0.03, Math.sin(th) * r); rnd.push(rand());
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aRnd', new THREE.Float32BufferAttribute(rnd, 1));
  var dustMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uTex: { value: STAR }, uMood: { value: 0 }, uTint: { value: new THREE.Color(1, 1, 1) } },
    vertexShader: `attribute float aRnd; uniform float uTime, uMood; varying float vA;
      void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0);
        vA = 0.25 + 0.75*pow(0.5+0.5*sin(uTime*(0.6+aRnd*2.0)+aRnd*50.0), 6.0);
        gl_PointSize = (0.05 + aRnd*0.06) * (1.0+uMood*0.4) * (300.0/-mv.z);
        gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform sampler2D uTex; uniform float uMood; uniform vec3 uTint; varying float vA;
      void main(){ vec4 t = texture2D(uTex, gl_PointCoord);
        vec3 col = mix(vec3(0.75,0.88,1.0), uTint, uMood*0.8);

            p: { spin: .5, glint: 1.4, spikes: 1, ringSpd: 4.2, spread: .45, lift: .22, bloom: .62, halo: .34, orbit: 1, wobble: .5,
                 core: 0x1e4f9a, haloC: 0x6fb0ff, att: 0xbfe0ff, tintC: 0x9fd0ff, tint: .7 } },
  freeze: { label: '當機中', color: '#d0d0d0', cap: '璨，一動也不動', rate: 1.3, dur: 2600,
            p: { time: 0, sink: 1, glint: .9, orbit: 0 } }
};
const NUM = Object.keys(BASE).filter(k => typeof BASE[k] === 'number' && !['core', 'haloC', 'att', 'tintC', 'bandC'].includes(k));
const COLS = ['core', 'haloC', 'att', 'tintC', 'bandC'];
const target = name => Object.assign({}, BASE, S[name].p || {});
const P = Object.assign({}, BASE);
const PC = {}; for (const k of COLS) PC[k] = new THREE.Color(BASE[k]);
const TC = {}; for (const k of COLS) TC[k] = new THREE.Color(BASE[k]);

const quoteEl = document.getElementById('quote'), moodEl = document.getElementById('mood');
const nightBtn = document.getElementById('night');
const lastLine = {};
// a quote is remembered as {s: state, i: index} or {f: fixedKey}, so switching language re-renders the same line
function pick(name) {
  const L = LINES.zh[name]; let i;
  do { i = Math.floor(Math.random() * L.length); } while (L.length > 1 && i === lastLine[name]);
  lastLine[name] = i; return { s: name, i };
}
let cur = { q: { s: 'calm', i: 0 }, cap: 'first' };
const qText = q => q.f ? FIXED[lang][q.f] : LINES[lang][q.s][q.i];
function renderQuote() { quoteEl.innerHTML = qText(cur.q) + '<small>' + CAP[lang][cur.cap] + '</small>'; }
function setQuote(q, cap) {
  cur = { q, cap };
  quoteEl.classList.add('swap');
  setTimeout(() => { renderQuote(); quoteEl.classList.remove('swap'); }, 380);
}

let booted = false;
let lang = (() => {
  try { const v = localStorage.getItem('can-lang'); if (v === 'zh' || v === 'ja') return v; } catch (_) {}
  return /^ja/i.test(navigator.language || '') ? 'ja' : 'zh';
})();
const langBtn = document.getElementById('lang');
function applyLang() {
  document.documentElement.lang = lang === 'ja' ? 'ja' : 'zh-Hant';
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = UI[lang][el.dataset.i18n]; if (v != null) el.innerHTML = v; });
  nightBtn.title = UI[lang].nightTitle;
  langBtn.textContent = lang === 'ja' ? '中文' : '日本語';
  if (booted) { moodEl.textContent = LABEL[lang][state]; renderQuote(); }
}
langBtn.addEventListener('click', () => {
  lang = lang === 'ja' ? 'zh' : 'ja';
  try { localStorage.setItem('can-lang', lang); } catch (_) {}
  quoteEl.classList.add('swap');
  setTimeout(() => { applyLang(); quoteEl.classList.remove('swap'); }, 300);
});
applyLang();

let nightMode = (() => { const h = new Date().getHours(); return h >= 23 || h < 5; })();
nightBtn.classList.toggle('on', nightMode);
const restState = () => nightMode ? 'night' : 'calm';
let state = 'calm', T = target('calm'), rate = 1.6, stateTimer = null, lineTimer = null, snapUntil = 0;

function enter(name, quote, cap) {
  state = name; T = target(name); rate = S[name].rate;
  for (const k of COLS) TC[k].set(T[k]);
  setQuote(quote ?? pick(name), cap ?? name);
  moodEl.textContent = LABEL[lang][name]; moodEl.style.color = S[name].color;
  clearTimeout(stateTimer); clearInterval(lineTimer);
  if (name === 'freeze') {
    stateTimer = setTimeout(() => { snapUntil = performance.now() + 700; enter(restState(), pick('freeze'), 'freezeAfter'); }, S.freeze.dur);
  } else if (S[name].dur) {
    stateTimer = setTimeout(() => enter(restState()), S[name].dur);
  } else if (name === 'calm' || name === 'night') {
    lineTimer = setInterval(() => setQuote(pick(state), state), 12000);
  }
}
enter(restState(), nightMode ? undefined : { s: 'calm', i: 0 }, nightMode ? undefined : 'first');
booted = true;
const resting = () => state === 'calm' || state === 'night';

// poking: a single poke flusters him, too many in a row and he freezes
let pokes = [];
function poke() {
  const now = performance.now();
  pokes = pokes.filter(t => now - t < 3500); pokes.push(now);
  if (state === 'freeze') return;
  if (pokes.length >= 4) { pokes = []; enter('freeze', { f: 'dots' }); return; }
  enter('shy');
}
document.getElementById('poke').addEventListener('click', () => { wake(); poke(); });
document.getElementById('compare').addEventListener('click', () => { wake(); if (state !== 'freeze') enter('angry'); });
nightBtn.addEventListener('click', () => {
  wake(); nightMode = !nightMode; nightBtn.classList.toggle('on', nightMode);
  if (resting()) enter(restState());
});

// ignoring him for a while makes him sulk
let lastActive = performance.now();
function wake() {
  lastActive = performance.now();
  if (state === 'sulk') enter(restState(), { f: 'sulkBack' }, 'sulkBack');
}
for (const ev of ['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart']) addEventListener(ev, wake, { passive: true });

// taps on the planet or the ring (double tap = poke)
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), inv = new THREE.Matrix4();
let downAt = null, tapTimer = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y), quick = performance.now() - downAt.t < 350;
  downAt = null;
  if (moved > 7 || !quick) return;
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; poke(); return; }
  const what = hitTest(e.clientX, e.clientY);
  tapTimer = setTimeout(() => {
    tapTimer = null;
    if (state === 'freeze') return;
    if (what === 'planet') enter('proud');
    else if (what === 'ring') enter('mirror');
  }, 280);
});
function hitTest(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(gem, false).length) return 'planet';
  const r = ray.ray.clone().applyMatrix4(inv.copy(ring.matrixWorld).invert());
  if (Math.abs(r.direction.y) < 1e-4) return null;
  const k = -r.origin.y / r.direction.y; if (k < 0) return null;
  const hx = r.origin.x + r.direction.x * k, hz = r.origin.z + r.direction.z * k, d = Math.hypot(hx, hz);
  return d > 2.1 && d < 3.9 ? 'ring' : null;
}

const ui = document.getElementById('ui');
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') ui.classList.toggle('hidden');
  if (e.key === 'f' || e.key === 'F') {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {}
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; frame(); camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth * Q.bloomScale, innerHeight * Q.bloomScale);
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
const dummy = new THREE.Object3D(), qs = new THREE.Quaternion(), qf = new THREE.Quaternion();
const lv = new THREE.Vector3();
const spinEl = document.getElementById('spin');
let intro = 0, first = true, t0 = performance.now(), simT = 0, sneak = 0, rockK = 0, mirrorDirty = false;
const tmpC = new THREE.Color();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const now = performance.now();
  const k = 1 - Math.exp(-dt * (now < snapUntil ? 9 : rate));
  for (const n of NUM) P[n] += (T[n] - P[n]) * k;
  for (const c of COLS) PC[c].lerp(TC[c], k);
  simT += dt * P.time;

  if (resting() && now - lastActive > 25000) enter('sulk');

  // intro dolly
  if (intro < 1) {
    intro = Math.min((now - t0) / 3400, 1);
    const e = 1 - Math.pow(1 - intro, 3);
    camera.position.lerpVectors(new THREE.Vector3(0, 3, 18), restPos, e);
    camera.lookAt(0, 0, 0);
    if (intro === 1) controls.enabled = true;
  }
  controls.autoRotateSpeed = P.orbit;
  controls.update();

  // planet
  const spin = P.spin * P.time;
  gem.rotation.y += dt * spin;
  innerFacets.rotation.y -= dt * 0.2 * P.time; innerFacets.rotation.x += dt * 0.07 * P.time;
  core.rotation.y += dt * 0.3 * P.time;
  planet.scale.setScalar(1 + Math.sin(t * 9) * 0.015 * P.wobble);
  spinEl.textContent = spin < 0.01 ? UI[lang].stopped : (2 * Math.PI / spin / 60 * 24).toFixed(1) + UI[lang].hours;

  coreMat.color.copy(PC.core);
  halo.material.color.copy(PC.haloC);
  halo.material.opacity = P.halo + Math.sin(t * 1.3) * 0.03;
  halo.scale.setScalar(P.haloSize);
  gemMat.attenuationColor.copy(PC.att);
  bloom.strength = P.bloom;
  renderer.toneMappingExposure = P.expo;

  for (const b of bands) {
    b.rotation.z += dt * b.userData.spd * P.time * (state === 'night' ? 0.3 : 1);
    b.material.color.copy(PC.bandC);
    b.material.opacity = b.userData.base * P.bands * (0.8 + 0.2 * Math.sin(t * 3 + b.position.y * 5));
    b.scale.setScalar(1 + (1 - Math.min(P.bands, 1)) * 0.08);
  }

  // spikes grow out of the facets when he is angry
  for (let i = 0; i < SP.length; i++) {
    const sp = SP[i], g = Math.max(0, Math.min(1, (P.spikes - sp.d * 0.5) / 0.5));
    const len = g * sp.k * (1 + 0.08 * Math.sin(t * 14 + i));
    dummy.position.copy(sp.pos); dummy.quaternion.copy(sp.q);
    dummy.scale.set(Math.max(g, 0.001), Math.max(len, 0.001), Math.max(g, 0.001));
    dummy.updateMatrix(); spikes.setMatrixAt(i, dummy.matrix);
  }
  spikes.instanceMatrix.needsUpdate = true;
  spikes.visible = P.spikes > 0.01;

  // ice crystals
  for (let i = 0; i < C.length; i++) {
    const c = C[i];
    c.th += dt * c.spd * P.ringSpd * P.time;
    const jitter = P.spread * (state === 'angry' ? Math.sin(simT * 7 + c.ph) * 0.15 : 0);
    const r = c.r * (1 - 0.16 * P.tightR) + P.spread * c.fr * 0.6 + jitter;
    const y = c.y * (1 - P.flat) + P.lift * (c.fy * 0.55 + Math.sin(simT * 1.3 + c.ph) * 0.18) - P.sink * (0.35 + c.fr * 0.9);
    dummy.position.set(Math.cos(c.th) * r, y, Math.sin(c.th) * r);
    qs.setFromAxisAngle(c.axis, simT * c.spin * (1 + P.spread));
    if (P.align > 0.001) {
      dummy.lookAt(0, 0, 0); qf.copy(dummy.quaternion);
      dummy.quaternion.copy(qs).slerp(qf, P.align);
    } else dummy.quaternion.copy(qs);
    const a = P.align;
    dummy.scale.set(c.s * (1 + 0.9 * a), c.s * (c.stretch * (1 - a) + 1.9 * a), c.s * (1 - 0.8 * a));
    dummy.updateMatrix();
    crystals.setMatrixAt(i, dummy.matrix);
    if (a > 0.005 || mirrorDirty) {
      // a wave of reflections running around the ring, each plate catching his light in turn
      const w = Math.pow(0.5 + 0.5 * Math.sin(c.th * 3 - t * 2.4), 10) * a;
      tmpC.copy(c.col).lerp(PC.tintC, a * 0.5).multiplyScalar(1 + w * 3.5);
      crystals.setColorAt(i, tmpC);
    }
  }
  crystals.instanceMatrix.needsUpdate = true;
  if (P.align > 0.005 || mirrorDirty) crystals.instanceColor.needsUpdate = true;
  mirrorDirty = P.align > 0.005;

  // rival rock
  rockK += ((state === 'angry' ? 1 : 0) - rockK) * (1 - Math.exp(-dt * 3));
  rock.scale.setScalar(Math.max(rockK, 0.001));
  rock.visible = rockK > 0.01;
  rock.rotation.y += dt * 0.4; rock.position.y = 1.5 + Math.sin(t * 1.4) * 0.12;

  // sulking: an occasional sneaky glint
  if (state === 'sulk' && Math.random() < dt * 0.35) sneak = 2.2;
  sneak *= Math.exp(-dt * 3);

  pointerS.lerp(pointer, 1 - Math.exp(-dt * 4));
  lv.set(pointerS.x * 6, pointerS.y * 5 + 2, 0).applyMatrix4(camera.matrixWorld);
  key.position.copy(lv);
  const gu = glintMat.uniforms;
  gu.uLight.value.set(pointerS.x * 1.4, pointerS.y * 1.4 + 0.4, 1);
  gu.uTime.value = simT; gu.uBoost.value = P.glint + sneak; gu.uSpec.value = P.spec + sneak * 0.4;
  gu.uMood.value = P.tint; gu.uTint.value.copy(PC.tintC);
  dustMat.uniforms.uTime.value = simT; dustMat.uniforms.uMood.value = P.tint; dustMat.uniforms.uTint.value.copy(PC.tintC);
  skyMat.uniforms.uTime.value = t;

  composer.render();
  if (first) { first = false; document.getElementById('loader').classList.add('done'); }
  requestAnimationFrame(tick);
}
tick();
</script>
<script>
  // if WebGL or the 3D library cannot load, say so instead of leaving a black screen
  setTimeout(() => {
    const l = document.getElementById('loader');
    if (l && !l.classList.contains('done')) l.textContent = document.documentElement.lang === 'ja' ? 'この端末では3D画面を読み込めないみたい。別のブラウザで試してみてね' : '這台裝置好像載入不了 3D 畫面，換個瀏覽器試試看';
  }, 12000);
</script>
</body>
</html>
